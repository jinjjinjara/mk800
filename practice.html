const TERMS=[...C.map(x=>x[2]),'구글세','솅겐조약','스텔스통장','특별인출권','홀라크라시','탄력세율','디폴트','추가경정예산','잠재성장률','크로스셀링','인구오너스','팹리스'];
let Q=[];function distract(i,n){let pool=C.filter((_,j)=>j!==i).map(x=>x[n]);return [...new Set(pool)].sort(()=>Math.random()-.5).slice(0,4)}function mk(i,v){let c=C[i],q,ans,opts;if(v%5===0){q=`다음 설명에 해당하는 개념은?\n\n${c[3]}`;ans=c[2];opts=[ans,...distract(i,2)]}else if(v%5===1){q=`다음 사례와 가장 관련된 개념은?\n\n${c[5]}`;ans=c[2];opts=[ans,...distract(i,2)]}else if(v%5===2){q=`‘${c[2]}’의 핵심 설명으로 옳은 것은?`;ans=c[4];opts=[ans,...distract(i,4)]}else if(v%5===3){q=`다음 중 ‘${c[2]}’에 대한 설명으로 가장 적절한 것은?`;ans=c[3];opts=[ans,...distract(i,3)]}else{q=`다음 설명과 가장 관련된 분야는?\n\n${c[3]}`;ans=c[1];opts=[ans,...new Set(C.filter((_,j)=>j!==i).map(x=>x[1]))].slice(0,5)}opts=opts.sort(()=>Math.random()-.5);return{id:`Q${String(i*10+v+1).padStart(4,'0')}`,subject:c[0],cat:c[1],q,opts,answer:opts.indexOf(ans),ex:`${c[2]}: ${c[3]}. ${c[4]}`}}for(let i=0;i<C.length;i++)for(let v=0;v<10;v++)Q.push(mk(i,v));
let S=JSON.parse(localStorage.getItem('mk500')||'{"done":{},"wrong":{},"history":[]}'),set=[],idx=0,correct=0,answered=false;const A=document.getElementById('app');function save(){localStorage.setItem('mk500',JSON.stringify(S))}function home(){let n=Object.keys(S.done).length,att=Object.values(S.done).reduce((a,x)=>a+x.n,0),ok=Object.values(S.done).reduce((a,x)=>a+x.c,0);A.innerHTML=`<div class="card hero"><span class="badge">앱 내부 자체 제작 문제</span><div><strong>${Q.length}</strong>문제</div><p class="muted">경제 250 · 경영 250 · 자동 오답노트</p></div><div class="grid"><div class="card"><b>푼 문제</b><h2>${n}/500</h2></div><div class="card"><b>정답률</b><h2>${att?Math.round(ok/att*100):0}%</h2></div><div class="card"><b>오답</b><h2>${Object.keys(S.wrong).length}</h2></div></div><div class="card"><h2>문제 시작</h2><div class="filters"><select id="sub"><option value="">전체</option><option>경제</option><option>경영</option></select><select id="cat"><option value="">전체 분야</option>${[...new Set(C.map(x=>x[1]))].map(x=>`<option>${x}</option>`).join('')}</select><select id="cnt"><option>10</option><option selected>20</option><option>50</option><option>80</option></select></div><div class="btns" style="margin-top:12px"><button class="btn primary" onclick="start()">맞춤 문제</button><button class="btn dark" onclick="mock()">80문제 모의고사</button><button class="btn danger" onclick="retry()">오답 재도전</button></div></div><div class="card"><h2>핵심 용어 ${TERMS.length}개</h2><div class="list">${TERMS.slice(0,20).map(x=>`<div class="item">${x}</div>`).join('')}</div></div>`}function start(){let p=Q.filter(x=>(!sub.value||x.subject===sub.value)&&(!cat.value||x.cat===cat.value));begin(p.sort(()=>Math.random()-.5).slice(0,+cnt.value))}function mock(){let e=Q.filter(x=>x.subject==='경제').sort(()=>Math.random()-.5).slice(0,40),b=Q.filter(x=>x.subject==='경영').sort(()=>Math.random()-.5).slice(0,40);begin([...e,...b].sort(()=>Math.random()-.5))}function retry(){let ids=Object.keys(S.wrong),p=ids.map(id=>Q.find(x=>x.id===id)).filter(Boolean);if(!p.length)return alert('오답이 없습니다.');begin(p)}function begin(p){set=p;idx=0;correct=0;show()}function show(){answered=false;let x=set[idx];A.innerHTML=`<div class="card"><div><span class="badge">${x.subject} · ${x.cat}</span> <span class="muted">${idx+1}/${set.length}</span></div><div class="q" style="margin-top:15px">${x.q}</div><div>${x.opts.map((o,i)=>`<button class="choice" onclick="answer(${i},this)"><b>${i+1}.</b> ${o}</button>`).join('')}</div><div id="result"></div><div class="btns"><button class="btn light" onclick="home()">그만하기</button></div></div>`}function answer(i,b){if(answered)return;answered=true;let x=set[idx],ok=i===x.answer,d=S.done[x.id]||{n:0,c:0};d.n++;if(ok){d.c++;correct++;delete S.wrong[x.id]}else S.wrong[x.id]=1;S.done[x.id]=d;save();document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;if(j===x.answer)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});result.innerHTML=`<div class="explain"><b>${ok?'정답입니다.':'오답입니다.'}</b><br>${x.ex}</div><button class="btn primary" style="margin-top:10px" onclick="next()">${idx===set.length-1?'결과 보기':'다음 문제'}</button>`}function next(){if(idx<set.length-1){idx++;show()}else{S.history.push({date:Date.now(),n:set.length,c:correct});save();A.innerHTML=`<div class="card" style="text-align:center"><h1>${correct}/${set.length}</h1><p>정답률 ${Math.round(correct/set.length*100)}%</p><div class="btns" style="justify-content:center"><button class="btn primary" onclick="retry()">오답 다시 풀기</button><button class="btn dark" onclick="home()">처음으로</button></div></div>`}}home();
</script></body></html>
