<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202b;--muted:#697386;--line:#dce2e8;--orange:#ff6534;--navy:#111827;--green:#16855f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));background:rgba(243,245,247,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top small{display:block;color:var(--orange);font-weight:800}.top h1{margin:2px 0 0;font-size:25px}.main{width:min(980px,100%);margin:auto;padding:20px max(16px,env(safe-area-inset-right)) 105px max(16px,env(safe-area-inset-left))}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 15px 40px rgba(15,23,42,.06)}.hero{background:linear-gradient(135deg,#111827,#27344b);color:#fff;border:0}.heroRow,.row,.head{display:flex;align-items:center;justify-content:space-between;gap:14px}.hero h2{font-size:56px;line-height:1;margin:15px 0 5px;letter-spacing:-.06em}.hero h2 span{font-size:18px;opacity:.65}.hero p{margin:0;color:rgba(255,255,255,.68)}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:800}.progress{height:9px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff6534,#ffad66)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.stat strong{display:block;font-size:30px;margin:8px 0 4px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 11px}.sectionTitle h2{font-size:20px;margin:0}.tasks,.list{display:grid;gap:10px}.task,.item{padding:14px;border-radius:16px;background:#f7f9fb;border:1px solid #edf0f3}.task strong,.item strong{display:block;margin-bottom:4px}.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800}.primary{background:var(--orange);color:#fff}.dark{background:var(--navy);color:#fff}.light{background:#edf1f5;color:var(--ink)}.danger{background:#fff0f0;color:#b83838}.full{width:100%}.notice{padding:13px 14px;border-radius:15px;background:#fff4e9;color:#78401e;font-size:13px;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px}.chip.done{background:#e8f7f0;border-color:#b7e4d3;color:#087253}.termCard{text-align:center;min-height:310px;display:grid;align-content:center}.termCard h2{font-size:38px;margin:8px}.termCard .meaning{font-size:17px;line-height:1.7;margin:15px auto;max-width:650px}.termNav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:800}.input{width:100%;margin-top:5px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rate{background:#f7f9fb;border-radius:16px;padding:14px}.rate input{width:75px;font-size:24px;font-weight:850;border:0;background:transparent}.bottom{position:fixed;z-index:20;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100% - 22px));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:rgba(17,24,39,.95);border-radius:22px;box-shadow:0 18px 45px rgba(15,23,42,.25)}.nav{border:0;background:transparent;color:#bec5d1;border-radius:16px;padding:10px 3px;font-size:11px;font-weight:800}.nav span{display:block;font-size:19px;margin-bottom:2px}.nav.active{background:rgba(255,255,255,.13);color:#fff}.bar{display:grid;grid-template-columns:68px 1fr 45px;align-items:center;gap:9px;margin:13px 0}.track{height:9px;background:#e9edf1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--orange)}.empty{text-align:center;color:var(--muted);padding:25px}.settings{display:grid;gap:14px}.quizOpt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;margin:8px 0}.correct{background:#e8f7f0!important;border-color:#8bd2b7!important}.wrong{background:#fff0f0!important;border-color:#eca4a4!important}@media(max-width:720px){.grid,.rates{grid-template-columns:1fr}.hero h2{font-size:48px}.heroRow{align-items:flex-start}.main{padding-top:14px}.card{padding:17px}.bottom{border-radius:20px}.nav{font-size:10px}}@media(min-width:800px){.sourceGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
</style>
</head>
<body>
<header class="top"><div><small>개인용 매경TEST 학습</small><h1>매경800</h1></div><button class="btn light" onclick="go('settings')">설정</button></header>
<main class="main">
<section id="home" class="page active"></section>
<section id="official" class="page"></section>
<section id="terms" class="page"></section>
<section id="wrong" class="page"></section>
<section id="records" class="page"></section>
<section id="settings" class="page"></section>
</main>
<nav class="bottom">
<button class="nav active" data-page="home"><span>⌂</span>홈</button>
<button class="nav" data-page="official"><span>▤</span>공식문제</button>
<button class="nav" data-page="terms"><span>◇</span>용어</button>
<button class="nav" data-page="wrong"><span>↺</span>오답</button>
<button class="nav" data-page="records"><span>▥</span>기록</button>
</nav>
<input id="importer" type="file" accept="application/json" hidden>
<script>
const LINKS={sample:'https://exam.mk.co.kr/exam_main.php?MM=5',mock:'https://exam.mk.co.kr/m/study_exam.php',terms:'https://exam.mk.co.kr/m/study.php',machuda:'https://www.machuda.kr/event/mktest',schedule:'https://exam.mk.co.kr/online_main.php?MM=2'};
const WORDS=[
['구글세','조세·디지털경제','다국적 디지털 기업이 이용자가 있는 국가에서 얻은 매출이나 이익에 세금을 내도록 하려는 과세 제도의 통칭이다.','고정 사업장이 없어도 시장 소재국이 과세권을 가질 수 있다는 논점이 핵심이다.'],
['솅겐조약','국제경제','가입국 사이의 국경 검문을 원칙적으로 없애 사람의 자유로운 이동을 보장한 유럽의 조약이다.','유럽연합 회원국과 솅겐 가입국의 범위가 완전히 같지는 않다.'],
['스텔스통장','금융','인터넷·모바일뱅킹이나 자동화기기에서 조회되지 않게 하고 영업점 거래만 허용하도록 설정한 계좌다.','불법 비밀계좌가 아니라 조회와 거래 채널을 제한한 계좌다.'],
['특별인출권','국제금융','국제통화기금이 회원국의 외환보유 자산을 보완하기 위해 만든 국제 준비자산이다.','일반인이 쓰는 통화가 아니라 IMF 회원국 사이의 준비자산이다.'],
['홀라크라시','조직·인사','직급 중심 위계 대신 역할과 자율적 조직 단위에 권한을 분산하는 운영 방식이다.','무질서가 아니라 역할과 규칙에 따라 권한을 분산한다.'],
['탄력세율','조세·재정','법률이 정한 범위 안에서 정부가 경제 상황과 정책 목적에 맞춰 조정할 수 있는 세율이다.','세법을 매번 전면 개정하지 않고 정해진 폭 안에서 조정한다.'],
['디폴트','국제금융','채무자가 원금이나 이자를 약정대로 갚지 못하는 채무불이행 상태다.','국가뿐 아니라 기업에도 사용할 수 있는 개념이다.'],
['추가경정예산','재정정책','본예산이 확정된 뒤 경기 변화나 재난 등으로 필요해 추가로 편성하는 예산이다.','경기 부양을 위한 확장적 재정정책 수단으로 쓰일 수 있다.'],
['잠재성장률','거시경제','물가 상승 압력을 크게 높이지 않으면서 한 경제가 달성할 수 있는 장기적 성장 능력이다.','노동·자본·생산성 같은 공급 측 요인의 영향을 받는다.'],
['크로스셀링','마케팅','기존 고객에게 주상품과 관련된 다른 상품을 함께 판매하는 전략이다.','더 비싼 상품으로 전환시키는 업셀링과 구별한다.'],
['인구오너스','인구경제','생산연령인구가 줄고 부양 부담이 커져 경제성장에 불리하게 작용하는 현상이다.','인구구조가 성장에 유리한 인구보너스의 반대 개념이다.'],
['팹리스','산업·경영','반도체 생산공장은 보유하지 않고 설계와 개발에 집중하는 기업 형태다.','생산을 담당하는 파운드리와 구별한다.']
];
const TOPICS=['GNP와 GDP','누진세율 계산','게임이론과 내쉬균형','뉴노멀','양면시장','시장점유율 자료','자기자본이익률','통합브랜드 전략','파생상품 손익','부품 자료해석'];
const DEF={settings:{target:830,exam:'2026-09-05',dailyTerms:5,dailyQuestions:20},rates:{k:60,t:55,c:50},word:{},sample:{},wrong:[],scores:[],records:[],activity:{}};
let S=load(),wordIndex=0;
function load(){try{return merge(JSON.parse(localStorage.getItem('mk800'))||{})}catch(e){return merge({})}}
function merge(x){return {...structuredClone(DEF),...x,settings:{...DEF.settings,...x.settings},rates:{...DEF.rates,...x.rates}}}
function save(){localStorage.setItem('mk800',JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function active(){S.activity[today()]=(S.activity[today()]||0)+1;save()}
function score(){return Math.round(S.rates.k*3+S.rates.t*5+S.rates.c*2)}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'short',day:'numeric'}).format(new Date(d))}
function dday(){let a=new Date();a.setHours(0,0,0,0);return Math.max(0,Math.ceil((new Date(S.settings.exam+'T00:00:00')-a)/864e5))}
function streak(){let n=0,d=new Date();for(;;){let k=d.toISOString().slice(0,10);if(S.activity[k]){n++;d.setDate(d.getDate()-1)}else return n}}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p);scrollTo(0,0)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(p='home'){({home,official,terms,wrong,records,settings}[p]||home)()}
function home(){let sc=score(),done=Object.values(S.word).filter(x=>x==='mastered').length,samples=Object.values(S.sample).filter(Boolean).length;homeEl.innerHTML=`<div class="card hero"><div class="heroRow"><div><span class="badge">목표 800점 · 안전 목표 ${S.settings.target}점</span><h2>${sc}<span>점</span></h2><p>영역별 정답률로 계산한 예상점수</p></div><div><b>D-${dday()}</b><p>${fmt(S.settings.exam)}</p></div></div><div class="progress"><i style="width:${Math.min(100,sc/S.settings.target*100)}%"></i></div></div><div class="grid"><div class="card stat"><span class="muted">연속 학습</span><strong>${streak()}일</strong></div><div class="card stat"><span class="muted">공식 샘플문제</span><strong>${samples}/10</strong></div><div class="card stat"><span class="muted">용어 암기</span><strong>${done}/${WORDS.length}</strong></div></div><div class="sectionTitle"><h2>오늘 할 일</h2><span class="muted">${today()}</span></div><div class="card tasks"><div class="task"><strong>용어 ${S.settings.dailyTerms}개</strong><span class="muted">카드 학습과 자동 복습</span></div><div class="task"><strong>공식 문제 ${S.settings.dailyQuestions}문항</strong><span class="muted">공식 사이트에서 풀고 결과 기록</span></div><div class="task"><strong>미해결 오답 ${S.wrong.filter(x=>!x.done).length}개</strong><span class="muted">틀린 이유와 핵심 개념 복습</span></div><div class="btns"><button class="btn primary" onclick="go('terms')">용어 공부</button><button class="btn dark" onclick="go('official')">공식 문제</button></div></div><div class="sectionTitle"><h2>영역별 정답률</h2></div><div class="card">${bar('지식',S.rates.k)}${bar('사고력',S.rates.t)}${bar('시사',S.rates.c)}</div>`}
const homeEl=document.getElementById('home');
function bar(n,v){return `<div class="bar"><b>${n}</b><div class="track"><div class="fill" style="width:${v}%"></div></div><span>${v}%</span></div>`}
function official(){document.getElementById('official').innerHTML=`<div class="notice">공식 문제 원문과 해설은 매경TEST 또는 맞추다 사이트에서 열고, 이 앱에는 완료·점수·오답만 기록합니다.</div><div class="sectionTitle"><h2>공식 샘플문제</h2><span class="muted">10개 유형</span></div><div class="card"><div class="head"><div><strong>매경TEST 공식 샘플문제</strong><p class="muted">공개 샘플과 공식 해설을 확인합니다.</p></div><button class="btn primary" onclick="openLink('sample')">문제 열기</button></div><div class="chips">${TOPICS.map((x,i)=>`<button class="chip ${S.sample[i]?'done':''}" onclick="toggleSample(${i})">${i+1}. ${x}</button>`).join('')}</div><div class="btns"><button class="btn light" onclick="recordForm('공식 샘플문제',10)">결과 기록</button></div></div><div class="sectionTitle"><h2>공식 모바일 모의고사</h2></div><div class="sourceGrid">${[1,2,3].map(n=>`<div class="card"><strong>모바일 모의고사 ${n}회</strong><p class="muted">회차당 20문항을 공식 페이지에서 풉니다.</p><div class="btns"><button class="btn primary" onclick="openLink('mock')">문제 열기</button><button class="btn light" onclick="recordForm('모바일 모의고사 ${n}회',20)">점수 기록</button></div></div>`).join('')}</div><div class="sectionTitle"><h2>맞추다 학습</h2></div><div class="card"><strong>매경TEST 문제·해설</strong><p class="muted">맞추다의 매경TEST 학습 페이지로 이동합니다.</p><button class="btn dark" onclick="openLink('machuda')">맞추다 열기</button></div>`}
function openLink(k){window.open(LINKS[k],'_blank','noopener')}
function toggleSample(i){S.sample[i]=!S.sample[i];active();official()}
function recordForm(name,total){let correct=prompt(`${name} 정답 개수를 입력하세요. (총 ${total}문항)`);if(correct===null)return;correct=Math.max(0,Math.min(total,+correct||0));S.records.push({name,total,correct,date:new Date().toISOString()});active();alert('기록했습니다.')}
function terms(){let w=WORDS[wordIndex],st=S.word[w[0]]||'new';document.getElementById('terms').innerHTML=`<div class="sectionTitle"><h2>학습용어</h2><span class="muted">${wordIndex+1}/${WORDS.length}</span></div><div class="card termCard"><span class="badge" style="background:#fff4e9;color:#9a461e">${w[1]} · ${st==='mastered'?'암기 완료':st==='learning'?'학습 중':'미학습'}</span><h2>${w[0]}</h2><p class="meaning">${w[2]}</p><div class="notice">시험 포인트: ${w[3]}</div></div><div class="termNav"><button class="btn light" onclick="moveWord(-1)">이전</button><button class="btn light" onclick="moveWord(1)">다음</button></div><div class="termNav"><button class="btn danger" onclick="learnWord('learning')">다시 보기</button><button class="btn primary" onclick="learnWord('mastered')">알고 있음</button></div><button class="btn dark full" style="margin-top:10px" onclick="quiz()">용어 퀴즈</button><div class="sectionTitle"><h2>전체 용어</h2></div><div class="card list">${WORDS.map((x,i)=>`<button class="item" style="text-align:left;border:0" onclick="wordIndex=${i};terms()"><strong>${x[0]}</strong><span class="muted">${x[1]} · ${S.word[x[0]]==='mastered'?'암기 완료':'학습 필요'}</span></button>`).join('')}</div>`}
function moveWord(n){wordIndex=(wordIndex+n+WORDS.length)%WORDS.length;terms()}
function learnWord(s){S.word[WORDS[wordIndex][0]]=s;active();moveWord(1)}
function quiz(){let q=WORDS[Math.floor(Math.random()*WORDS.length)],opts=[q];while(opts.length<4){let x=WORDS[Math.floor(Math.random()*WORDS.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);document.getElementById('terms').innerHTML=`<div class="sectionTitle"><h2>용어 퀴즈</h2></div><div class="card"><p>${q[2]}</p>${opts.map(x=>`<button class="quizOpt" onclick="answer(this,'${x[0]}','${q[0]}')">${x[0]}</button>`).join('')}<div id="quizResult"></div></div>`}
function answer(b,x,a){document.querySelectorAll('.quizOpt').forEach(z=>z.disabled=true);b.classList.add(x===a?'correct':'wrong');quizResult.innerHTML=`<div class="notice">${x===a?'정답입니다.':'정답은 '+a+'입니다.'}</div><button class="btn dark full" style="margin-top:10px" onclick="quiz()">다음 문제</button>`;S.word[a]=x===a?'mastered':'learning';active()}
function wrong(){document.getElementById('wrong').innerHTML=`<div class="sectionTitle"><h2>오답노트</h2></div><div class="card"><div class="notice">문제 원문 대신 출처·문제 번호·틀린 이유·핵심 개념만 기록하세요.</div><form class="form" style="margin-top:14px" onsubmit="addWrong(event)"><label>문제 표시<input class="input" name="title" placeholder="예: 모바일 모의고사 2회 7번" required></label><label>틀린 이유<select class="input" name="reason"><option>개념을 몰랐다</option><option>개념을 혼동했다</option><option>계산을 틀렸다</option><option>자료를 잘못 읽었다</option><option>시간이 부족했다</option><option>시사 지식이 부족했다</option></select></label><label>핵심 개념<textarea class="input" name="concept" rows="3" required></textarea></label><button class="btn primary">오답 저장</button></form></div><div class="sectionTitle"><h2>저장한 오답</h2><span class="muted">${S.wrong.length}개</span></div><div class="card list">${S.wrong.length?S.wrong.map((x,i)=>`<div class="item"><strong>${esc(x.title)}</strong><p class="muted">${esc(x.reason)}</p><p>${esc(x.concept)}</p><div class="btns"><button class="btn ${x.done?'light':'primary'}" onclick="doneWrong(${i})">${x.done?'다시 열기':'복습 완료'}</button><button class="btn danger" onclick="delWrong(${i})">삭제</button></div></div>`).join(''):'<div class="empty">아직 저장된 오답이 없습니다.</div>'}</div>`}
function addWrong(e){e.preventDefault();let f=new FormData(e.target);S.wrong.push({title:f.get('title'),reason:f.get('reason'),concept:f.get('concept'),done:false,date:new Date().toISOString()});active();wrong()}
function doneWrong(i){S.wrong[i].done=!S.wrong[i].done;active();wrong()}
function delWrong(i){if(confirm('삭제할까요?')){S.wrong.splice(i,1);save();wrong()}}
function records(){document.getElementById('records').innerHTML=`<div class="sectionTitle"><h2>예상점수</h2></div><div class="card"><div class="heroRow"><div><span class="muted">현재 예상점수</span><strong style="display:block;font-size:42px">${score()}점</strong></div><span class="badge" style="background:${score()>=800?'#e8f7f0':'#fff4e9'};color:${score()>=800?'#087253':'#8b4b20'}">${score()>=800?'최우수권':'목표까지 '+(800-score())+'점'}</span></div><div class="rates" style="margin-top:15px">${rate('k','지식',300)}${rate('t','사고력',500)}${rate('c','시사',200)}</div><button class="btn primary full" style="margin-top:12px" onclick="snapshot()">현재 점수 기록</button></div><div class="sectionTitle"><h2>점수 기록</h2></div><div class="card list">${S.scores.length?[...S.scores].reverse().map(x=>`<div class="item"><strong>${x.score}점</strong><span class="muted">지식 ${x.r.k}% · 사고력 ${x.r.t}% · 시사 ${x.r.c}% · ${fmt(x.date)}</span></div>`).join(''):'<div class="empty">아직 점수 기록이 없습니다.</div>'}</div><div class="sectionTitle"><h2>공식 문제 기록</h2></div><div class="card list">${S.records.length?[...S.records].reverse().map(x=>`<div class="item"><strong>${esc(x.name)}</strong><span class="muted">${x.correct}/${x.total}문항 · ${Math.round(x.correct/x.total*100)}% · ${fmt(x.date)}</span></div>`).join(''):'<div class="empty">아직 풀이 기록이 없습니다.</div>'}</div>`}
function rate(k,n,w){return `<div class="rate"><label>${n} · ${w}점</label><div><input type="number" min="0" max="100" value="${S.rates[k]}" onchange="S.rates.${k}=Math.max(0,Math.min(100,+this.value));save();records()">%</div><span class="muted">예상 ${Math.round(S.rates[k]*w/100)}점</span></div>`}
function snapshot(){S.scores.push({score:score(),r:{...S.rates},date:new Date().toISOString()});active();records()}
function settings(){document.getElementById('settings').innerHTML=`<div class="sectionTitle"><h2>설정</h2></div><div class="card settings"><form class="form" onsubmit="saveSettings(event)"><label>안전 목표점수<input class="input" type="number" name="target" min="800" max="1000" value="${S.settings.target}"></label><label>시험일<input class="input" type="date" name="exam" value="${S.settings.exam}"></label><label>하루 용어 수<input class="input" type="number" name="dailyTerms" min="1" max="30" value="${S.settings.dailyTerms}"></label><label>하루 문제 수<input class="input" type="number" name="dailyQuestions" min="5" max="100" value="${S.settings.dailyQuestions}"></label><button class="btn primary">저장</button></form><div class="notice"><strong>아이패드 설치</strong><br>Safari에서 이 페이지를 열고 공유 버튼 → 홈 화면에 추가를 누르세요.</div><div class="btns"><button class="btn dark" onclick="backup()">백업 내보내기</button><button class="btn light" onclick="importer.click()">백업 가져오기</button><button class="btn danger" onclick="resetAll()">전체 초기화</button></div></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);S.settings={target:+f.get('target'),exam:f.get('exam'),dailyTerms:+f.get('dailyTerms'),dailyQuestions:+f.get('dailyQuestions')};save();alert('저장했습니다.');home()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mk800_backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
importer.onchange=e=>{let r=new FileReader();r.onload=()=>{try{S=merge(JSON.parse(r.result));save();alert('복원했습니다.');go('home')}catch(x){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(e.target.files[0])};
function resetAll(){if(confirm('모든 기록을 삭제할까요?')){S=merge({});save();go('home')}}
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
